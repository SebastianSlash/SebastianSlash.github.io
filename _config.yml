title: Sebastian Bellitto
author: Sebastian Bellitto
description: "I'm a software engineer focused on building modular, extensible
  and well documented test solutions used in international development environments."
url: "https://sebastianbellitto.com"
markdown: kramdown
# highlighter: coderay
permalink: /blog/:year/:month/:day/:title

collections:
  blogtype:
    output: true

defaults:
  - scope:
      path: ""
      type: "blogtype"
    values:
      layout: "bloghome"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
